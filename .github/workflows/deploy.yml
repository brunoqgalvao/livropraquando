name: validar e publicar
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # Os testes das regras vêm antes do validador porque respondem a perguntas
      # diferentes: o validate confere o catálogo, os testes conferem as regras
      # que produzem o catálogo. Dá pra passar no validate com um extrator que
      # aprendeu a inventar crédito de ilustrador.
      #
      # Não rodavam aqui, e quem garantia que passavam era o agente à mão, só
      # quando ele lembrava de ter mexido em `.mjs`. Foi ele que apontou.
      # `auditoria.test.mjs` entra; `auditoria.mjs` NÃO — aquele abre as páginas
      # citadas na rede, e reprovar o deploy porque a Amazon caiu seria trocar
      # um erro por outro.
      - run: for t in scripts/lib/*.test.mjs scripts/auditoria.test.mjs; do node "$t"; done

      # O validador é o portão. Catálogo quebrado não vai pro ar.
      - run: node scripts/validate.mjs

      - run: node scripts/build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_NOME: ${{ vars.SITE_NOME }}

      - run: echo "${{ vars.SITE_DOMINIO }}" > site/CNAME
        if: vars.SITE_DOMINIO != ''

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
